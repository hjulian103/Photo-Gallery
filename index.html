<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Anime.js CDN for gallery animations -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="anime.js" defer></script>
</head>
<body>
    <div class="background-container">
    <header class="layout header">
            <h1>Photo Gallery</h1>
            <p>A collection of some of my favorite shots!</p>
        </header>
        <main class="layout.main">
            <div class="layout.container">
                <div class="gallery">
                    <img width="300px" src="imgs/bld_moon.JPG"  class="gallery-item">
                    <img width="250px" src="imgs/cov.jpg"  class="gallery-item">
                    <img width="250px" src="imgs/falcon.JPG"  class="gallery-item">
                    <img width="200px" src="imgs/flower.JPG"  class="gallery-item">
                    <img width="200px" src="imgs/mal_orb.jpg"  class="gallery-item">
                    <img width="300px" src="imgs/mal.JPG"  class="gallery-item">
                    <img width="500px" src="imgs/mila.JPG"  class="gallery-item">
                    <img width="450px" src="imgs/ron_mal.JPG"  class="gallery-item">
                    <img width="350px" src="imgs/ron.JPG"  class="gallery-item">
                    <img width="500px" src="imgs/sagey.JPG"  class="gallery-item">
                    <img width="350px" src="imgs/statue.JPG"  class="gallery-item">
                    <img width="250px" src="imgs/bird.jpg"  class="gallery-item">
                    <img width="300px" src="imgs/footbll-1.jpeg"  class="gallery-item">
                    <img width="400px" src="imgs/s_board.JPG"  class="gallery-item">
                    <img width="300px" src="imgs/mirror.png"  class="gallery-item">
                    <img width="400px" src="imgs/sun_mila.JPG"  class="gallery-item">
                </div>
                <!-- Image Popup Modal -->
                <div id="imgModal" class="img-modal" style="display:none;">
                    <span class="img-modal-close" id="imgModalClose">&times;</span>
                    <img class="img-modal-content" id="imgModalImg" src="" alt="">
                    <div id="imgModalCaption" class="img-modal-caption"></div>
                </div>
            </div>
        </main>
        <footer class="layout.footer">
            <p>&copy; 2025 Julian's Gallery</p>
        </footer>
    </div>
    <script src="anime.js"></script>
</body>
</html>
